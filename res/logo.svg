<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ArtifactX</title>
  <desc id="desc">ArtifactX wordmark: a signed package mark followed by the ArtifactX name.</desc>
  <defs>
    <linearGradient id="l-top" x1="56" y1="46" x2="192" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="l-left" x1="56" y1="82" x2="124" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="l-right" x1="192" y1="82" x2="124" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="l-seal" x1="152" y1="150" x2="224" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="l-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(16 30) scale(0.86)">
    <g stroke="#0C4A6E" stroke-width="5" stroke-linejoin="round">
      <path d="M124 42 L192 82 L124 122 L56 82 Z" fill="url(#l-top)"/>
      <path d="M56 82 L124 122 L124 200 L56 160 Z" fill="url(#l-left)"/>
      <path d="M192 82 L124 122 L124 200 L192 160 Z" fill="url(#l-right)"/>
    </g>
    <path d="M124 122 L124 200" stroke="#0C4A6E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="186" cy="186" r="37" fill="url(#l-seal)" stroke="#14532D" stroke-width="5"/>
    <path d="M168 186 L180 198 L205 171" stroke="#14532D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="168" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="800" letter-spacing="-3.5">Artifact<tspan fill="url(#l-word)">X</tspan></text>
  <text x="252" y="222" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700" letter-spacing="5">IMPORT · SIGN · PUBLISH · STATIC</text>
</svg>
