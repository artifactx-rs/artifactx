<svg width="1080" height="500" viewBox="0 0 1080 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ArtifactX pipeline</title>
  <desc id="desc">Existing apt or yum repositories, local .deb and .rpm files, or a Cargo.toml feed one arx binary that imports, packs, signs, and publishes static repository files or serves them directly to apt and dnf clients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1220"/><stop offset="1" stop-color="#070B12"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#22D3EE" flood-opacity="0.16"/></filter>
    <style>
      .h{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-size:26px;font-weight:800;fill:#F1F5F9;letter-spacing:-0.5px}
      .l{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-size:19px;font-weight:650;fill:#E2E8F0}
      .s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;font-weight:500;fill:#8FA1B8}
      .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;fill:#22D3EE;letter-spacing:1.9px}
      .c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600;fill:#CBD5E1}
    </style>
  </defs>

  <rect width="1080" height="500" rx="26" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1079" height="499" rx="26" stroke="#1E293B"/>

  <text x="44" y="60" class="h">One binary between your packages and your clients</text>
  <text x="44" y="92" class="s">Import what you already publish, pack what you build, sign the metadata, then host static files or serve them.</text>

  <!-- inputs -->
  <g>
    <rect x="44" y="126" width="268" height="76" rx="16" fill="#0F172A" stroke="#25324A"/>
    <text x="68" y="157" class="l">Existing apt repo</text>
    <text x="68" y="182" class="s">Packages.gz</text>

    <rect x="44" y="216" width="268" height="76" rx="16" fill="#0F172A" stroke="#25324A"/>
    <text x="68" y="247" class="l">Existing yum repo</text>
    <text x="68" y="272" class="s">repodata/repomd.xml</text>

    <rect x="44" y="306" width="268" height="76" rx="16" fill="#0F172A" stroke="#25324A"/>
    <text x="68" y="337" class="l">Your build output</text>
    <text x="68" y="362" class="s">.deb .rpm .apk .pkg.tar.zst</text>
  </g>

  <path d="M312 164 C348 164 356 224 390 224" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ar)" opacity=".8"/>
  <path d="M312 254 H390" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ar)" opacity=".8"/>
  <path d="M312 344 C348 344 356 284 390 284" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ar)" opacity=".8"/>

  <!-- core -->
  <g filter="url(#glow)">
    <rect x="390" y="126" width="330" height="256" rx="22" fill="#0B1322" stroke="#0891B2" stroke-width="1.5"/>
  </g>
  <text x="418" y="164" class="k">ARX</text>
  <text x="418" y="196" class="l">import · pack · add</text>
  <path d="M418 216 H692" stroke="#1E293B" stroke-width="1"/>
  <text x="418" y="248" class="l">publish</text>
  <text x="418" y="274" class="s">build metadata in staging, sign it,</text>
  <text x="418" y="296" class="s">then flip the live state atomically</text>
  <path d="M418 318 H692" stroke="#1E293B" stroke-width="1"/>
  <text x="418" y="346" class="c">apt InRelease · Release.gpg</text>
  <text x="418" y="368" class="c">yum repomd.xml.asc</text>

  <g transform="translate(646 148)">
    <circle cx="26" cy="26" r="26" fill="url(#lime)"/>
    <path d="M14 27 L22 35 L39 15" stroke="#052E16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M720 214 C752 214 758 200 790 200" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ar)" opacity=".8"/>
  <path d="M720 294 C752 294 758 308 790 308" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ar)" opacity=".8"/>

  <!-- outputs -->
  <rect x="790" y="152" width="246" height="96" rx="16" fill="#0F172A" stroke="#25324A"/>
  <text x="812" y="184" class="l">Static files</text>
  <text x="812" y="209" class="s">Pages · S3 · nginx</text>
  <text x="812" y="231" class="s">no daemon, no database</text>

  <rect x="790" y="262" width="246" height="96" rx="16" fill="#0F172A" stroke="#25324A"/>
  <text x="812" y="294" class="l">arx serve</text>
  <text x="812" y="319" class="s">static + REST API + metrics</text>
  <text x="812" y="341" class="s">token or GitHub OIDC for writes</text>

  <!-- trust bar -->
  <rect x="44" y="406" width="992" height="56" rx="14" fill="#050912" stroke="#1A2436"/>
  <text x="68" y="440" class="k">TRUST</text>
  <text x="152" y="440" class="s">Clients verify signed repository metadata, not the host. Package payload signatures stay in your build pipeline.</text>
</svg>
