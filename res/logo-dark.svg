<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ArtifactX (dark theme)</title>
  <desc id="desc">ArtifactX wordmark for dark backgrounds: a signed package mark followed by the ArtifactX name.</desc>
  <defs>
    <linearGradient id="ld-top" x1="56" y1="46" x2="192" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="ld-left" x1="56" y1="82" x2="124" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="ld-right" x1="192" y1="82" x2="124" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="ld-seal" x1="152" y1="150" x2="224" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="ld-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(16 30) scale(0.86)">
    <g stroke="#0C4A6E" stroke-width="5" stroke-linejoin="round">
      <path d="M124 42 L192 82 L124 122 L56 82 Z" fill="url(#ld-top)"/>
      <path d="M56 82 L124 122 L124 200 L56 160 Z" fill="url(#ld-left)"/>
      <path d="M192 82 L124 122 L124 200 L192 160 Z" fill="url(#ld-right)"/>
    </g>
    <path d="M124 122 L124 200" stroke="#0C4A6E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="186" cy="186" r="37" fill="url(#ld-seal)" stroke="#052E16" stroke-width="5"/>
    <path d="M168 186 L180 198 L205 171" stroke="#052E16" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="168" fill="#F1F5F9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="800" letter-spacing="-3.5">Artifact<tspan fill="url(#ld-word)">X</tspan></text>
  <text x="252" y="222" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700" letter-spacing="5">IMPORT · SIGN · PUBLISH · STATIC</text>
</svg>
