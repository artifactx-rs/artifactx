<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ArtifactX mark</title>
  <desc id="desc">A signed package: an isometric cube with a verification seal at its lower right.</desc>
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1524"/>
      <stop offset="1" stop-color="#060B14"/>
    </linearGradient>
    <linearGradient id="m-top" x1="58" y1="46" x2="190" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="m-left" x1="58" y1="84" x2="124" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="m-right" x1="190" y1="84" x2="124" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="m-seal" x1="152" y1="150" x2="224" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#m-bg)"/>
  <rect x="1" y="1" width="254" height="254" rx="57" stroke="#1E293B" stroke-width="2"/>

  <!-- package cube -->
  <g stroke="#0C4A6E" stroke-width="5" stroke-linejoin="round">
    <path d="M124 42 L192 82 L124 122 L56 82 Z" fill="url(#m-top)"/>
    <path d="M56 82 L124 122 L124 200 L56 160 Z" fill="url(#m-left)"/>
    <path d="M192 82 L124 122 L124 200 L192 160 Z" fill="url(#m-right)"/>
  </g>
  <path d="M124 122 L124 200" stroke="#0C4A6E" stroke-width="5" stroke-linecap="round"/>

  <!-- verification seal -->
  <circle cx="186" cy="186" r="37" fill="url(#m-seal)" stroke="#052E16" stroke-width="5"/>
  <path d="M168 186 L180 198 L205 171" stroke="#052E16" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
